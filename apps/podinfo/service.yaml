# NOTE: this file gets DELETED when we introduce Flagger.
#
# Flagger wants to own the apex Service so it can flip its selector between
# podinfo-primary and podinfo-canary. If Git also owns it, Argo CD and Flagger
# fight over the selector forever and you get a lovely flapping demo of why
# two reconcilers must never own the same field.
apiVersion: v1
kind: Service
metadata:
  name: podinfo
  namespace: chiya
spec:
  type: ClusterIP
  selector:
    app: podinfo
  ports:
    - name: http
      port: 80
      targetPort: 9898
      protocol: TCP
